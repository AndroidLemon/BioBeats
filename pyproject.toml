[project]
name = "biometric-music-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bleak", "magenta-rt"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
