[project]
name = "biobeats"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bleak",
    "magenta-rt",
    "mido",
    "mlx>=0.31.2",
    "numpy",
    "python-osc",
    "python-rtmidi",
    "sounddevice",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
