[project]
name = "biometric-music-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bleak", "magenta-rt", "numpy", "python-osc", "sounddevice"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
